name: Windows Desktop Artifact Build

concurrency:
  group: desktop-artifact-build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/desktop-artifact-build.yml"
      - "desktop/**"
      - "frontend/**"
      - "server/**"
      - "collector/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  artifact-scope:
    name: Determine desktop artifact scope
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.scope.outputs.full_build }}
    steps:
      - name: Checkout repository for change detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether full Windows packaging is required
        id: scope
        env:
          DESKTOP_BUILD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DESKTOP_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node desktop/scripts/desktop-artifact-change-scope.cjs

  validate-desktop-inputs:
    name: Validate desktop artifact inputs
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate desktop shell and packaging scripts
        run: |
          npm run desktop:smoke
          node --check desktop/scripts/package-windows-artifact.cjs
          node --check desktop/scripts/desktop-artifact-change-scope.cjs

  build-windows-desktop-artifact:
    name: Build Windows desktop artifact
    needs: [artifact-scope, validate-desktop-inputs]
    if: needs.artifact-scope.outputs.full_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_VERSION: 33.4.11
      PUPPETEER_SKIP_DOWNLOAD: "true"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend build dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Install production server dependencies
        working-directory: server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          yarn install --frozen-lockfile --production=true
          if ($LASTEXITCODE -eq 0) { exit 0 }

          Write-Warning "Normal install failed; seeding the pinned ripgrep binary without the GitHub Releases API and retrying."
          yarn install --frozen-lockfile --production=true --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ripgrepBin = Join-Path $PWD "node_modules/@vscode/ripgrep/bin"
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep-v15.0.1-x86_64-pc-windows-msvc.zip"
          if (Test-Path $ripgrepBin) { Remove-Item -Recurse -Force $ripgrepBin }
          New-Item -ItemType Directory -Force -Path $ripgrepBin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v15.0.1/ripgrep-v15.0.1-x86_64-pc-windows-msvc.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $ripgrepBin -Force
          $ripgrepExe = Join-Path $ripgrepBin "rg.exe"
          if (!(Test-Path $ripgrepExe)) { throw "Pinned ripgrep binary was not extracted." }
          & $ripgrepExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate Prisma client (server)
        working-directory: server
        run: yarn prisma generate
      - name: Validate yarn lockfiles
        shell: pwsh
        run: |
          $required = @("frontend/yarn.lock", "server/yarn.lock", "collector/yarn.lock")
          foreach ($lockfile in $required) {
            if (!(Test-Path $lockfile)) { throw "Missing required lockfile: $lockfile" }
          }
      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Build desktop shell
        run: npm run desktop:smoke
      - name: Download Electron runtime
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "electron-win32-x64"
          Invoke-WebRequest -Uri "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION/electron-v$env:ELECTRON_VERSION-win32-x64.zip" -OutFile $zipPath
          if (Test-Path $extractPath) { Remove-Item -Recurse -Force $extractPath }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          "ELECTRON_DIST_PATH=$extractPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Package desktop app with fast archive path
        run: npm run desktop:artifact:package:win
      - name: Assess signing readiness
        run: npm run desktop:signing:check
      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: swarmsy-desktop-win32-x64
          path: desktop/artifacts/swarmsy-desktop-win32-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Smoke validation
        run: npm run desktop:artifact:smoke
      - name: Launch packaged desktop and verify fresh first run
        shell: pwsh
        run: |
          $logPath = "desktop/artifacts/desktop-runtime-smoke.log"
          npm run desktop:runtime:smoke:win 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload desktop runtime smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime-smoke-diagnostics
          path: desktop/artifacts/desktop-runtime-smoke.log
          if-no-files-found: error
          retention-days: 14
