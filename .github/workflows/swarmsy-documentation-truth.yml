name: SWARMSY documentation truth

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "README.md"
      - "docs/swarmsy/**"
      - "scripts/swarmsy-documentation-truth.test.mjs"
      - "package.json"
      - ".github/workflows/swarmsy-documentation-truth.yml"
  push:
    branches: [master]
    paths:
      - "README.md"
      - "docs/swarmsy/**"
      - "scripts/swarmsy-documentation-truth.test.mjs"
      - "package.json"
      - ".github/workflows/swarmsy-documentation-truth.yml"

permissions:
  contents: read

jobs:
  docs-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run SWARMSY documentation truth guard
        run: node scripts/swarmsy-documentation-truth.test.mjs
