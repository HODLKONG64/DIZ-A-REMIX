name: PR 137 backup test diagnostics

on:
  push:
    branches:
      - feat/project-backup-restore-plan-preview

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        working-directory: server
        run: yarn install --frozen-lockfile

      - name: Run focused backup contract tests
        id: diagnostics
        working-directory: server
        shell: bash
        run: |
          set +e
          npx jest __tests__/frontend/projectBackupPanel.test.js __tests__/frontend/projectBackupRestorePlanPreview.test.js --runInBand > ../backup-test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post diagnostics to PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Temporary PR 137 backup test diagnostics'
            echo
            echo "Test exit: ${{ steps.diagnostics.outputs.status }}"
            echo
            echo '```text'
            tail -n 160 backup-test-output.txt
            echo '```'
          } > diagnostic-comment.md
          gh pr comment 137 --body-file diagnostic-comment.md
