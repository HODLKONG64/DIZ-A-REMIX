name: PR 136 server lint auto-fix

on:
  push:
    branches:
      - fix/local-user-swarmsy-data-ownership

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/local-user-swarmsy-data-ownership

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        working-directory: server
        run: yarn install --frozen-lockfile

      - name: Apply server lint fixes
        working-directory: server
        run: yarn lint

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "Apply server lint fixes"
          git push origin HEAD:fix/local-user-swarmsy-data-ownership
