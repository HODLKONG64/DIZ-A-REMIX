name: PR 138 frontend lint autofix

on:
  push:
    branches:
      - fix/swarmsy-additive-anythingllm-boundary

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/swarmsy-additive-anythingllm-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Apply frontend lint fixes
        working-directory: frontend
        run: yarn lint
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "Apply frontend lint fixes"
          git push origin HEAD:fix/swarmsy-additive-anythingllm-boundary
